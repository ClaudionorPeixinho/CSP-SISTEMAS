  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Analytics is optional: only load it when a real endpoint is configured
      // via VITE_ANALYTICS_ENDPOINT / VITE_ANALYTICS_WEBSITE_ID, so local/offline
      // usage does not fire a request to a literal, unreplaced placeholder URL.
      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (endpoint && websiteId) {
        const script = document.createElement("script");
        script.defer = true;
        script.src = `${endpoint}/umami`;
        script.dataset.websiteId = websiteId;
        document.body.appendChild(script);
      }
    </script>
  </body>
